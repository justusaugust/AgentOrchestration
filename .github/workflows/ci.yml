name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest --cov=src tests/
      - name: Lint
        run: uv run flake8 src/ tests/

  image-metadata-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build image with sentinel build config
        env:
          BUILD_SENTINEL: internal-config-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker build \
            --build-arg AO_BUILD_CONFIG="$BUILD_SENTINEL" \
            --build-arg AO_BUILD_VERSION="ci-${GITHUB_SHA}" \
            -t agent-orchestrator:metadata-audit .
          python3 scripts/audit_image_metadata.py \
            agent-orchestrator:metadata-audit \
            --forbidden "$BUILD_SENTINEL"
